<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0877b4">
<meta name="description" content="Grow your Harborlight island, develop its buildings and keep your residents happy.">
<title>HARBORLIGHT — Your Island</title>
<link rel="stylesheet" href="harborlight-v1-play.css?v=frontend-v26">
<link rel="stylesheet" href="harborlight-v1-minigame.css?v=frontend-v26-fit2">
<link rel="stylesheet" href="harborlight-v1-tutorial.css?v=frontend-v26">
<link rel="stylesheet" href="harborlight-v1-onboarding.css?v=frontend-v26">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0877b4;color:#fff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0877b4}
body{background:radial-gradient(circle at 50% 42%,#21add5 0%,#0877b4 58%,#045c91 100%)}
#viewport{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center}
#stage{position:absolute;width:1672px;height:941px;transform-origin:center center;background:#0877b4;overflow:hidden}
.layer{position:absolute;inset:0;pointer-events:none}
.slice{position:absolute;display:block;overflow:hidden;image-rendering:auto}
.slice canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;z-index:99;display:grid;place-items:center;background:#0877b4;font-weight:800;letter-spacing:.05em}
#loading[hidden]{display:none}
.error{padding:18px 24px;border-radius:16px;background:#0b2940;border:1px solid #ffd56a}
.debug .slice{outline:2px solid rgba(255,255,255,.8);outline-offset:-2px}
.debug .slice::after{content:attr(data-label);position:absolute;left:6px;top:6px;padding:4px 7px;border-radius:6px;background:rgba(5,20,30,.8);font-size:12px;font-weight:900;color:#fff}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage" aria-label="HARBORLIGHT v1 layered visual screen">
    <div id="worldLayer" class="layer" data-layer="world"></div>
    <div id="uiLayer" class="layer" data-layer="ui"></div>
    <div id="semanticLayer" class="layer" data-layer="semantic" aria-label="Interactive island controls">
      <div data-component="lighthouse"></div>
      <div data-component="village"></div>
      <div data-component="forestry"></div>
      <div data-component="farm"></div>
      <div data-component="quarry"></div>
      <div data-component="harbor"></div>
    </div>
    <div id="loading">Loading approved v1 visual…</div>
  </div>
  <p id="world-pan-hint">Drag to explore the island</p>
</div>
<script>
(() => {
  const LOGICAL_W = 1672;
  const LOGICAL_H = 941;
  const stage = document.getElementById('stage');
  const world = document.getElementById('worldLayer');
  const ui = document.getElementById('uiLayer');
  const loading = document.getElementById('loading');

  const slices = [
    {name:'hud-left',      layer:ui,    x:0,    y:0,   w:600,  h:70},
    {name:'world-top',     layer:world, x:600,  y:0,   w:370,  h:70},
    {name:'hud-resources', layer:ui,    x:970,  y:0,   w:702,  h:70},
    {name:'ocean-edge',    layer:world, x:0,    y:70,  w:115,  h:630},
    {name:'world-main',    layer:world, x:115,  y:70,  w:1185, h:630},
    {name:'right-stack',   layer:ui,    x:1300, y:70,  w:372,  h:630},
    {name:'world-bottom-left',  layer:world, x:0,    y:700, w:250,  h:241},
    {name:'build-dock',         layer:ui,    x:250,  y:700, w:1050, h:241},
    {name:'world-bottom-right', layer:world, x:1300, y:700, w:372,  h:241}
  ];

  const viewport = document.getElementById('viewport');
  let portrait = false, worldScale = 1, panX = null, drag = null, suppressClick = false;
  const clampPan = value => Math.max(Math.min(0, viewport.clientWidth - 1395 * worldScale), Math.min(0, value));
  function positionWorld(){ stage.style.transform = `translate(${panX}px, ${-78 * worldScale}px) scale(${worldScale})`; }
  function resize(){
    const compact = matchMedia('(max-width:900px),(max-height:500px)').matches;
    portrait = matchMedia('(max-width:900px) and (orientation:portrait)').matches;
    document.body.classList.toggle('portrait-world', portrait);
    const mobileHeader = document.querySelector('.mobile-island-hud');
    const topInset = compact ? Math.max(120, Math.ceil(mobileHeader?.getBoundingClientRect().bottom || 0) + 8) : 0;
    const touchDock = document.querySelector('.mobile-bottom-dock');
    const dockInset = portrait && touchDock ? Math.max(304, Math.ceil(innerHeight - touchDock.getBoundingClientRect().top) + 8) : 304;
    viewport.style.top = `${topInset}px`;
    viewport.style.bottom = portrait ? `${dockInset}px` : '0px';
    if (portrait) {
      viewport.style.display = 'block';
      stage.style.left = '0'; stage.style.top = '0'; stage.style.transformOrigin = '0 0';
      worldScale = Math.max(1, innerHeight - topInset - dockInset) / (708 - 78);
      panX = clampPan(panX === null ? viewport.clientWidth / 2 - 740 * worldScale : panX);
      positionWorld();
    } else {
      viewport.style.display = 'grid'; stage.style.left = ''; stage.style.top = ''; stage.style.transformOrigin = 'center center';
      const scale = Math.min(innerWidth / LOGICAL_W, Math.max(0, innerHeight - topInset) / LOGICAL_H);
      stage.style.transform = `scale(${scale})`; panX = null;
    }
  }
  viewport.setAttribute('tabindex','0'); viewport.setAttribute('role','region'); viewport.setAttribute('aria-label','Island world — drag or use arrow keys to explore');
  viewport.addEventListener('pointerdown', event => { if (portrait && event.isPrimary) drag = { id:event.pointerId, x:event.clientX, start:panX, moved:false }; });
  viewport.addEventListener('pointermove', event => {
    if (!portrait || !drag || event.pointerId !== drag.id) return;
    if (Math.abs(event.clientX - drag.x) > 5) { drag.moved = true; viewport.setPointerCapture(event.pointerId); }
    if (!drag.moved) return;
    panX = clampPan(drag.start + event.clientX - drag.x); positionWorld(); event.preventDefault();
  });
  viewport.addEventListener('pointerup', () => { if (drag?.moved) { suppressClick = true; viewport.focus({preventScroll:true}); } drag = null; });
  viewport.addEventListener('pointercancel', () => { drag = null; });
  viewport.addEventListener('click', event => { if (suppressClick) { event.preventDefault(); event.stopImmediatePropagation(); suppressClick = false; } }, true);
  viewport.addEventListener('keydown', event => { if (portrait && event.target === viewport && ['ArrowLeft','ArrowRight'].includes(event.key)) { event.preventDefault(); panX = clampPan(panX + (event.key === 'ArrowLeft' ? 65 : -65)); positionWorld(); } });
  addEventListener('resize', resize, {passive:true});
  addEventListener('island-dock-layout', resize); resize();
  // The introductory tour can centre an actual building on portrait screens.
  // This moves only the camera; it never clicks or changes the building.
  addEventListener('island-tour-focus', event => {
    const region = event.detail?.region;
    if (!portrait || !Array.isArray(region) || region.length !== 4 || !region.every(Number.isFinite)) return;
    panX = clampPan(viewport.clientWidth / 2 - (region[0] + region[2] / 2) * worldScale);
    positionWorld();
  });

  const params = new URLSearchParams(location.search);
  if(params.get('debug') === '1') stage.classList.add('debug');

  function makeSlice(source, s){
    const el = document.createElement('div');
    el.className = 'slice';
    el.dataset.label = s.name;
    el.dataset.component = s.name;
    Object.assign(el.style, {left:s.x+'px', top:s.y+'px', width:s.w+'px', height:s.h+'px'});

    const canvas = document.createElement('canvas');
    canvas.width = s.w;
    canvas.height = s.h;
    const ctx = canvas.getContext('2d');

    const sx = s.x / LOGICAL_W * source.naturalWidth;
    const sy = s.y / LOGICAL_H * source.naturalHeight;
    const sw = s.w / LOGICAL_W * source.naturalWidth;
    const sh = s.h / LOGICAL_H * source.naturalHeight;
    if (s.name === 'ocean-edge') {
      ctx.save(); ctx.translate(s.w,0); ctx.scale(-1,1);
      ctx.drawImage(source, 115 / LOGICAL_W * source.naturalWidth, sy, sw, sh, 0, 0, s.w, s.h);
      ctx.restore();
    } else ctx.drawImage(source, sx, sy, sw, sh, 0, 0, s.w, s.h);

    el.appendChild(canvas);
    s.layer.appendChild(el);
  }

  const source = new Image();
  source.onload = () => {
    slices.forEach(s => makeSlice(source, s));
    loading.hidden = true;
  };
  source.onerror = () => {
    loading.innerHTML = '<div class="error">Approved v1 visual could not be loaded.</div>';
  };
  source.src = 'assets/harborlight-v1-approved.png';
})();
</script>
<dialog id="island-dialog" class="island-dialog" aria-labelledby="dialog-title"></dialog>
<div id="island-toast" class="island-toast" role="status" aria-live="polite" hidden></div>
<div id="placement-banner" class="placement-banner" hidden></div>
<script type="module" src="harborlight-v1-play.js?v=frontend-v26"></script>
</body>
</html>
