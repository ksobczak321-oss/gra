name: Validate HARBORLIGHT source

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Keep simulation, API and browser tests sequential: the offline simulation
      # has a deliberate watchdog and must not compete with Chromium for CPU.
      - name: Test game rules and release promotion gates
        run: node --test --test-concurrency=1 --test-isolation=none tests/*.test.mjs

      - name: Test API infrastructure endpoints
        run: node --test backend/test/*.test.mjs

      - name: Test isolated backend image payload
        run: python3 tests/harborlight-backend-package.test.py

      - name: Test cloud bootstrap safety
        run: python3 tests/harborlight-gcp-bootstrap.test.py

      - name: Test read-only cloud verification
        run: python3 tests/harborlight-gcp-verify.test.py

      - name: Test deterministic frontend release bundle
        run: python3 tests/harborlight-frontend-bundle.test.py

      - name: Test Firebase Hosting preparation safety
        run: python3 tests/harborlight-firebase-hosting.test.py

      - name: Test permanent DEV account preparation safety
        run: python3 tests/harborlight-dev-users.test.py

      - name: Test guarded post-promotion PRE-PROD account reset
        run: python3 tests/harborlight-preprod-reset.test.py

      - name: Test production domain preparation safety
        run: python3 tests/harborlight-domain.test.py

      - name: Test isolated runtime and Hosting configuration
        run: python3 tests/harborlight-runtime-config.test.py

      - name: Test monthly billing alert configuration safety
        run: python3 tests/harborlight-budget.test.py

      - name: Test dry-run tracking issue import and idempotency
        run: python3 tests/harborlight-tracking-issues.test.py

      - name: Verify generated change cards and their index
        run: python3 scripts/build_change_register.py --check

      - name: Verify generated manual QA checklist and case index
        run: python3 scripts/build_manual_checklist.py --check

      - name: Test standalone physical game scenario
        run: node --test docs/boardgame/session.test.mjs

      - name: Verify generated legal documents match their reviewed drafts
        run: python3 scripts/build_legal_pages.py --check

      - name: Install browser acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path)
              if not executable.is_file():
                  raise RuntimeError('Installed Chromium executable was not found')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write(f'HARBORLIGHT_CHROMIUM={executable}\n')
          PY

      - name: Build the frontend release being validated
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_frontend.py --commit "$GITHUB_SHA" \
            --output build/frontend --archive build/harborlight-frontend.tar.gz

      - name: Test packaged game and both tutorial programs in Chromium
        id: browser
        env:
          HARBORLIGHT_FRONTEND_ROOT: ${{ github.workspace }}/build/frontend
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 -u - <<'PY' 2>&1 | tee "$RUNNER_TEMP/harborlight-browser.log"
          import subprocess
          import sys

          for test in ('tests/harborlight-frontend-v17-smoke.py', 'tests/harborlight-frontend-v18-smoke.py', 'tests/harborlight-tutorial-v18-smoke.py', 'tests/harborlight-tutorial-v21-smoke.py', 'tests/harborlight-tutorial-v22-smoke.py', 'tests/harborlight-tutorial-priority-v22-smoke.py'):
              print('Starting browser acceptance: ' + test, flush=True)
              status = subprocess.call([sys.executable, '-u', test])
              if status:
                  sys.exit(status)
          PY
          browser_status=${PIPESTATUS[0]}
          set -e
          if (( browser_status != 0 )); then
            node --input-type=module - "$RUNNER_TEMP/harborlight-browser.log" <<'JS' || true
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8') || 'Browser acceptance failed without output.';
          let escaped = '';
          for (const character of Array.from(text.slice(-6000)).reverse()) {
            const piece = character === '%' ? '%25' : character === '\r' ? '%0D' : character === '\n' ? '%0A' : character;
            if (escaped.length + piece.length > 6000) break;
            escaped = piece + escaped;
          }
          console.log(`::error title=Packaged game browser acceptance failed::${escaped}`);
          JS
          fi
          exit "$browser_status"

      - name: Test packaged DEV login and cloud saves in Chromium
        id: dev_browser
        env:
          HARBORLIGHT_FRONTEND_ROOT: ${{ github.workspace }}/build/frontend
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 -u - <<'PY' 2>&1 | tee "$RUNNER_TEMP/harborlight-dev-browser.log"
          import subprocess
          import sys

          for test in ('tests/harborlight-dev-auth-smoke.py', 'tests/harborlight-dev-game-smoke.py', 'tests/harborlight-settings-signout-smoke.py', 'tests/harborlight-v18-auth-smoke.py', 'tests/harborlight-onboarding-v20-smoke.py', 'tests/harborlight-v21-features-smoke.py', 'tests/harborlight-help-v24-smoke.py', 'tests/harborlight-community-v24-smoke.py', 'tests/harborlight-charity-v24-smoke.py', 'tests/harborlight-manual-checklist-smoke.py'):
              status = subprocess.call([sys.executable, '-u', test])
              if status:
                  sys.exit(status)
          PY
          browser_status=${PIPESTATUS[0]}
          set -e
          if (( browser_status != 0 )); then
            node --input-type=module - "$RUNNER_TEMP/harborlight-dev-browser.log" <<'JS' || true
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8').slice(-6000);
          const escaped = text.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log(`::error title=DEV account browser acceptance failed::${escaped}`);
          JS
          fi
          exit "$browser_status"

      - name: Publish browser failure diagnostics
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: browserfailure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harborlight-browser.log
            /tmp/harborlight-v18-*.png
            /tmp/harborlight-v17-*.png
            /tmp/harborlight-v21-*.png
            /tmp/harborlight-v22-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish DEV account browser failure diagnostics
        if: ${{ failure() && steps.dev_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: dev-account-browserfailure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harborlight-dev-browser.log
            /tmp/harborlight-dev-*.png
            /tmp/harborlight-v21-*.png
            /tmp/harborlight-v22-*.png
          if-no-files-found: error
          retention-days: 7
