name: Deploy HARBORLIGHT game to Google Cloud dev

# Deliberately manual: a commit alone must not create or change billed resources.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-cloud-dev
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.ci.outputs.ci_run_attempt }}
      source_sha: ${{ steps.ci.outputs.source_sha }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require successful CI for this exact commit
        id: ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node infra/google-cloud/promotion.mjs check-ci

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    environment:
      name: google-cloud-dev
      url: ${{ steps.hosting.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'harborlight-dev' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/28040211190/locations/global/workloadIdentityPools/harborlight-github/providers/github-main' }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT || 'harborlight-deployer@harborlight-dev.iam.gserviceaccount.com' }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'harborlight-runtime@harborlight-dev.iam.gserviceaccount.com' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'harborlight' }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'harborlight-api-dev' }}
      HARBORLIGHT_VERIFIED_SHA: ${{ needs.gate.outputs.source_sha }}
      HARBORLIGHT_CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
      HARBORLIGHT_CI_RUN_ATTEMPT: ${{ needs.gate.outputs.ci_run_attempt }}
      HARBORLIGHT_ACCOUNT_API_ENABLED: ${{ vars.HARBORLIGHT_ACCOUNT_API_ENABLED || 'false' }}
      HARBORLIGHT_FRONTEND_URL: https://harborlight-dev.web.app
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate development configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT GCP_ARTIFACT_REPOSITORY GCP_CLOUD_RUN_SERVICE; do
            if [[ -z "${!key}" ]]; then
              printf '::error::Missing google-cloud-dev environment variable: %s\n' "$key"
              exit 1
            fi
          done
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_PROJECT_ID" == harborlight-dev ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$GCP_ARTIFACT_REPOSITORY" =~ ^[a-z][a-z0-9_-]{0,62}$ ]]
          [[ "$GCP_CLOUD_RUN_SERVICE" =~ ^[a-z]([a-z0-9-]{0,47}[a-z0-9])?$ ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          for key in GCP_DEPLOYER_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT; do
            [[ "${!key}" =~ ^[a-z][a-z0-9-]*@[a-z][a-z0-9-]*\.iam\.gserviceaccount\.com$ ]]
            [[ "${!key}" == *"@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]]
          done
          [[ "$GCP_DEPLOYER_SERVICE_ACCOUNT" != "$GCP_RUNTIME_SERVICE_ACCOUNT" ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_SHA" == "$HARBORLIGHT_VERIFIED_SHA" ]]
          [[ "$HARBORLIGHT_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$HARBORLIGHT_CI_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          printf 'HARBORLIGHT_IMAGE_TAG=%s-docker.pkg.dev/%s/%s/api:%s\n' \
            "$GCP_REGION" "$GCP_PROJECT_ID" "$GCP_ARTIFACT_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test API infrastructure endpoints
        shell: bash
        run: node --test backend/test/*.test.mjs

      - name: Build the exact frontend release bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_frontend.py --commit "$GITHUB_SHA" \
            --output build/frontend --archive build/harborlight-frontend.tar.gz \
            > "$RUNNER_TEMP/harborlight-frontend-build.json"
          node --input-type=module - "$RUNNER_TEMP/harborlight-frontend-build.json" <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (metadata.commit !== process.env.GITHUB_SHA ||
              !/^[a-f0-9]{64}$/.test(metadata.archive_sha256) ||
              !/^[a-f0-9]{64}$/.test(metadata.manifest_sha256)) {
            throw new Error('Frontend bundle did not confirm the source commit and hashes');
          }
          appendFileSync(process.env.GITHUB_ENV,
            `HARBORLIGHT_FRONTEND_ARCHIVE_SHA256=${metadata.archive_sha256}\n` +
            `HARBORLIGHT_FRONTEND_MANIFEST_SHA256=${metadata.manifest_sha256}\n`);
          JS

      - name: Install pinned Firebase deployment tool
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/harborlight-firebase-cli" \
            --no-audit --no-fund firebase-tools@15.34.2
          printf '%s\n' "$RUNNER_TEMP/harborlight-firebase-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install hosted browser acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path)
              if not executable.is_file():
                  raise RuntimeError('Installed Chromium executable was not found')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write(f'HARBORLIGHT_CHROMIUM={executable}\n')
          PY

      # Build before requesting a short-lived Google identity. The Docker context
      # contains only backend/, never the repository's generated auth file.
      - name: Build single-platform API image once
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --pull --platform=linux/amd64 \
            --provenance=false --sbom=false --load \
            --tag "$HARBORLIGHT_IMAGE_TAG" backend/

      - name: Start the exact API image before requesting cloud credentials
        shell: bash
        run: |
          set -euo pipefail
          api_container="harborlight-api-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup_api_container() {
            docker rm --force "$api_container" >/dev/null 2>&1 || true
          }
          trap cleanup_api_container EXIT
          docker run --detach --name "$api_container" --network none \
            --env HARBORLIGHT_ENV=development \
            --env "HARBORLIGHT_RELEASE=$GITHUB_SHA" \
            --env HARBORLIGHT_ACCOUNT_API=0 "$HARBORLIGHT_IMAGE_TAG"
          api_ready=false
          for attempt in {1..30}; do
            if docker exec "$api_container" node --input-type=module -e '
              for (const endpoint of ["health", "ready"]) {
                const response = await fetch(`http://127.0.0.1:8080/${endpoint}`);
                const body = await response.json();
                if (!response.ok || body.status !== "ok" || body.service !== "harborlight-api" ||
                    body.environment !== "development" || body.release !== process.env.HARBORLIGHT_RELEASE) {
                  throw new Error("The built API image did not confirm its health, environment and release");
                }
              }
              const accounts = await fetch("http://127.0.0.1:8080/api/v1/island");
              if (accounts.status !== 503 || (await accounts.json()).error !== "account_api_disabled") {
                throw new Error("The image smoke test must not enable account/database access");
              }
            ' > "$RUNNER_TEMP/harborlight-image-smoke.log" 2>&1; then
              api_ready=true
              break
            fi
            if [[ "$(docker inspect --format='{{.State.Running}}' "$api_container")" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$api_ready" != true ]]; then
            docker logs "$api_container" || true
            cat "$RUNNER_TEMP/harborlight-image-smoke.log"
            printf '::error::The built API image could not start locally; cloud deployment was not attempted.\n'
            exit 1
          fi
          printf 'Built image: health, readiness and disabled account API confirmed without cloud credentials.\n'

      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify isolated development project
        shell: bash
        run: |
          set -euo pipefail
          project_environment="$(gcloud projects describe "$GCP_PROJECT_ID" \
            --format='value(labels.harborlight_env)')"
          if [[ "$project_environment" != dev ]]; then
            printf '::error::This project is not marked as harborlight_env=dev by the bootstrap.\n'
            exit 1
          fi

      - name: Push API image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker push "$HARBORLIGHT_IMAGE_TAG"

      - name: Resolve immutable DEV image digest
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(gcloud artifacts docker images describe "$HARBORLIGHT_IMAGE_TAG" \
            --project="$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            printf '::error::Artifact Registry did not return a valid SHA-256 image digest.\n'
            exit 1
          fi
          image_prefix="${HARBORLIGHT_IMAGE_TAG%:*}"
          printf 'HARBORLIGHT_SOURCE_IMAGE=%s@%s\n' "$image_prefix" "$image_digest" >> "$GITHUB_ENV"

      - name: Generate isolated runtime settings
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/google-cloud/runtime-config.py --project "$GCP_PROJECT_ID" \
            --release "$GITHUB_SHA" --account-api-enabled "$HARBORLIGHT_ACCOUNT_API_ENABLED" \
            --output "$RUNNER_TEMP/harborlight-runtime.json"

      - name: Deploy development API
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$HARBORLIGHT_SOURCE_IMAGE" \
            --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --execution-environment=gen2 \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --cpu-throttling \
            --no-cpu-boost \
            --min-instances=0 \
            --max-instances=2 \
            --concurrency=20 \
            --timeout=30 \
            --ingress=all \
            --allow-unauthenticated \
            --env-vars-file="$RUNNER_TEMP/harborlight-runtime.json" \
            --quiet
          api_url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          [[ "$api_url" =~ ^https://[a-z0-9.-]+\.run\.app$ ]]
          printf 'url=%s\n' "$api_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed infrastructure endpoints
        shell: bash
        env:
          HARBORLIGHT_API_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for endpoint in health ready; do
            response="$(curl --fail --silent --show-error \
              --retry 8 --retry-all-errors --retry-connrefused --retry-delay 3 \
              --connect-timeout 10 --max-time 20 \
              "$HARBORLIGHT_API_URL/$endpoint")"
            HEALTH_RESPONSE="$response" node --input-type=module -e '
              const body = JSON.parse(process.env.HEALTH_RESPONSE);
              if (body === null || body.status !== "ok" ||
                  body.service !== "harborlight-api" ||
                  body.environment !== "development" ||
                  body.release !== process.env.GITHUB_SHA) {
                throw new Error("Deployed endpoint did not confirm the expected service, environment and commit");
              }
            '
            printf '%s: OK\n' "$endpoint"
          done

      - name: Generate environment-specific Hosting routing
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/google-cloud/hosting-config.py --project "$GCP_PROJECT_ID" \
            --service "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" \
            --output "$RUNNER_TEMP/harborlight-hosting.json"

      - name: Deploy the frontend bundle to Firebase Hosting DEV
        id: hosting
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$GCP_PROJECT_ID" \
            --non-interactive --config "$RUNNER_TEMP/harborlight-hosting.json"
          printf 'url=%s\n' "$HARBORLIGHT_FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Verify the exact hosted frontend release
        shell: bash
        run: |
          set -euo pipefail
          node infra/google-cloud/verify-hosted-release.mjs \
            build/frontend/release.json "$RUNNER_TEMP/harborlight-hosted-release.json"

      - name: Test the actual hosted game in Chromium
        id: hosted_browser
        env:
          HARBORLIGHT_BASE_URL: https://harborlight-dev.web.app
          HARBORLIGHT_HOSTED_EVIDENCE_PATH: ${{ runner.temp }}/harborlight-hosted-evidence.json
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 -u tests/harborlight-hosted-v18-smoke.py 2>&1 | tee "$RUNNER_TEMP/harborlight-hosted-browser.log"
          browser_status=${PIPESTATUS[0]}
          set -e
          if (( browser_status != 0 )); then
            node --input-type=module - "$RUNNER_TEMP/harborlight-hosted-browser.log" <<'JS' || true
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8') || 'Hosted browser acceptance failed without output.';
          let escaped = '';
          for (const character of Array.from(text.slice(-6000)).reverse()) {
            const piece = character === '%' ? '%25' : character === '\r' ? '%0D' : character === '\n' ? '%0A' : character;
            if (escaped.length + piece.length > 6000) break;
            escaped = piece + escaped;
          }
          console.log(`::error title=Hosted browser acceptance failed::${escaped}`);
          JS
          fi
          if (( browser_status == 0 )); then
            node --input-type=module - "$RUNNER_TEMP/harborlight-hosted-evidence.json" <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const evidence = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const enabled = ['true', '1'].includes(process.env.HARBORLIGHT_ACCOUNT_API_ENABLED.toLowerCase());
          if (evidence.project !== 'harborlight-dev' || evidence.commit !== process.env.GITHUB_SHA ||
              evidence.authenticated_island_render !== true || evidence.account_api !== enabled) {
            throw new Error('Hosted evidence did not confirm the configured PRE-PROD account API');
          }
          appendFileSync(process.env.GITHUB_ENV, `HARBORLIGHT_ACCOUNT_API_VERIFIED=${evidence.account_api ? 'true' : 'false'}\n`);
          JS
          fi
          exit "$browser_status"

      - name: Publish hosted browser failure diagnostics
        if: ${{ failure() && steps.hosted_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-browserfailure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harborlight-hosted-browser.log
            /tmp/harborlight-v18-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Verify permanent DEV accounts and cloud save isolation
        shell: bash
        run: |
          set -euo pipefail
          account_check_flags=(--passwords-match-logins)
          case "${HARBORLIGHT_ACCOUNT_API_ENABLED,,}" in
            true|1) account_check_flags+=(--account-api) ;;
            false|0) ;;
            *) echo "Invalid PRE-PROD account API mode" >&2; exit 1 ;;
          esac
          node infra/google-cloud/check-dev-accounts.mjs "${account_check_flags[@]}"

      - name: Publish the exact successful DEV frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: harborlight-dev-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/harborlight-frontend.tar.gz
          if-no-files-found: error
          retention-days: 90

      # The receipt is created only after the immutable API image and exact
      # frontend bundle were deployed, every hosted asset matched the package,
      # and an existing authenticated island rendered with writes blocked.
      - name: Write successful DEV release receipt
        env:
          HARBORLIGHT_RECEIPT_PATH: ${{ runner.temp }}/harborlight-release/release.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/harborlight-release"
          node infra/google-cloud/promotion.mjs write-receipt

      - name: Publish successful DEV release receipt
        uses: actions/upload-artifact@v4
        with:
          name: harborlight-dev-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/harborlight-release/release.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize validated DEV release
        shell: bash
        env:
          HARBORLIGHT_API_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          {
            printf '### HARBORLIGHT — gra na GCP DEV\n\n'
            printf 'Graj: %s\n\n' "$HARBORLIGHT_FRONTEND_URL"
            printf 'Adres API: %s\n\n' "$HARBORLIGHT_API_URL"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Obraz: `%s`\n\n' "$HARBORLIGHT_SOURCE_IMAGE"
            printf 'Pakiet frontendu SHA-256: `%s`\n\n' "$HARBORLIGHT_FRONTEND_ARCHIVE_SHA256"
            printf 'Manifest frontendu SHA-256: `%s`\n\n' "$HARBORLIGHT_FRONTEND_MANIFEST_SHA256"
            printf 'CI: [%s](%s/%s/actions/runs/%s), próba %s.\n\n' \
              "$HARBORLIGHT_CI_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
              "$HARBORLIGHT_CI_RUN_ID" "$HARBORLIGHT_CI_RUN_ATTEMPT"
            printf 'Potwierdzenie DEV: `harborlight-dev-release-%s-%s`.\n\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Sprawdzone: `/health`, `/ready`, manifest wydania i sumy wszystkich plików hostingu, wejście anonimowe i odczytowe renderowanie istniejącej zalogowanej wyspy PRE-PROD; pełne scenariusze pakietu przeszły CI.\n\n'
            printf 'Konta DEV: trzy trwałe tożsamości oraz odczyt własnego zapisu i odmowa odczytu cudzych zapisów; kontrola nie nadpisuje wysp.\n\n'
            printf 'Cloud Run: min. 0, maks. 2 instancje na rewizję; nie jest to limit faktury.\n\n'
            printf 'PRE-PROD zachowuje trzy istniejące konta i zapis Firestore. Test hostowanej wyspy blokuje zapisy; nie tworzy, nie resetuje ani nie zmienia postępu. API kont jest aktywowane wyłącznie osobną flagą po konfiguracji IAM. Gospodarka nadal jest obliczana przez klienta.\n'
          } >> "$GITHUB_STEP_SUMMARY"
