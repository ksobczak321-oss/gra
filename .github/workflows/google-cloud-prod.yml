name: Promote verified HARBORLIGHT DEV release to PROD

on:
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: 'ID zakończonego sukcesem wdrożenia DEV do promocji'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-cloud-prod
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.receipt.outputs.source_sha }}
      source_image: ${{ steps.receipt.outputs.source_image }}
      image_digest: ${{ steps.receipt.outputs.image_digest }}
      ci_run_id: ${{ steps.receipt.outputs.ci_run_id }}
      dev_run_id: ${{ steps.dev.outputs.dev_run_id }}
      frontend_artifact_name: ${{ steps.receipt.outputs.frontend_artifact_name }}
      frontend_archive_sha256: ${{ steps.receipt.outputs.frontend_archive_sha256 }}
      frontend_manifest_sha256: ${{ steps.receipt.outputs.frontend_manifest_sha256 }}
    steps:
      # Gate logic comes from current main, never from a user-selected release.
      - name: Checkout trusted promotion rules
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require a successful DEV deployment and its receipt
        id: dev
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARBORLIGHT_DEV_RUN_ID: ${{ inputs.dev_run_id }}
        run: node infra/google-cloud/promotion.mjs check-dev

      - name: Download receipt from the exact DEV run and attempt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.dev.outputs.dev_run_id }}
          name: ${{ steps.dev.outputs.artifact_name }}
          path: ${{ runner.temp }}/harborlight-dev-receipt

      - name: Validate tested commit, immutable image and successful source CI
        id: receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HARBORLIGHT_SOURCE_SHA: ${{ steps.dev.outputs.source_sha }}
          HARBORLIGHT_DEV_RUN_ID: ${{ steps.dev.outputs.dev_run_id }}
          HARBORLIGHT_DEV_RUN_ATTEMPT: ${{ steps.dev.outputs.dev_run_attempt }}
          HARBORLIGHT_DEV_IMAGE_PREFIX: europe-central2-docker.pkg.dev/harborlight-dev/harborlight/api
          HARBORLIGHT_REQUIRE_ACCOUNT_API: 'true'
          HARBORLIGHT_RECEIPT_PATH: ${{ runner.temp }}/harborlight-dev-receipt/release.json
        run: node infra/google-cloud/promotion.mjs verify-receipt

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      actions: read
    environment:
      name: google-cloud-prod
      url: https://harborlight.pl
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'harborlight-prod' }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/992911312434/locations/global/workloadIdentityPools/harborlight-github/providers/github-main' }}
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT || 'harborlight-deployer@harborlight-prod.iam.gserviceaccount.com' }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT || 'harborlight-runtime@harborlight-prod.iam.gserviceaccount.com' }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'harborlight' }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE || 'harborlight-api-prod' }}
      HARBORLIGHT_SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      HARBORLIGHT_SOURCE_IMAGE: ${{ needs.gate.outputs.source_image }}
      HARBORLIGHT_IMAGE_DIGEST: ${{ needs.gate.outputs.image_digest }}
      HARBORLIGHT_DEV_RUN_ID: ${{ needs.gate.outputs.dev_run_id }}
      HARBORLIGHT_FRONTEND_ARTIFACT_NAME: ${{ needs.gate.outputs.frontend_artifact_name }}
      HARBORLIGHT_FRONTEND_ARCHIVE_SHA256: ${{ needs.gate.outputs.frontend_archive_sha256 }}
      HARBORLIGHT_FRONTEND_MANIFEST_SHA256: ${{ needs.gate.outputs.frontend_manifest_sha256 }}
      HARBORLIGHT_ACCOUNT_API_ENABLED: ${{ vars.HARBORLIGHT_ACCOUNT_API_ENABLED || 'false' }}
      HARBORLIGHT_PROD_SMOKE_EMAIL: ${{ secrets.HARBORLIGHT_PROD_SMOKE_EMAIL }}
      HARBORLIGHT_PROD_SMOKE_PASSWORD: ${{ secrets.HARBORLIGHT_PROD_SMOKE_PASSWORD }}
      HARBORLIGHT_FRONTEND_URL: https://harborlight.pl
    steps:
      - name: Checkout trusted deployment configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT GCP_ARTIFACT_REPOSITORY GCP_CLOUD_RUN_SERVICE; do
            if [[ -z "${!key}" ]]; then
              printf '::error::Missing google-cloud-prod environment variable: %s\n' "$key"
              exit 1
            fi
          done
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          if [[ "${HARBORLIGHT_ACCOUNT_API_ENABLED,,}" != true && "$HARBORLIGHT_ACCOUNT_API_ENABLED" != 1 ]]; then
            printf '::error::PROD account API must be explicitly enabled after owner IAM/database setup. No deployment was started.\n'
            exit 1
          fi
          if [[ -z "$HARBORLIGHT_PROD_SMOKE_EMAIL" || -z "$HARBORLIGHT_PROD_SMOKE_PASSWORD" ]]; then
            printf '::error::Configure the owner-selected existing PROD smoke account in scoped GitHub secrets. No account or island will be created by acceptance.\n'
            exit 1
          fi
          [[ "$GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GCP_PROJECT_ID" == harborlight-prod ]]
          [[ "$GCP_REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]]
          [[ "$GCP_ARTIFACT_REPOSITORY" =~ ^[a-z][a-z0-9_-]{0,62}$ ]]
          [[ "$GCP_CLOUD_RUN_SERVICE" =~ ^[a-z]([a-z0-9-]{0,47}[a-z0-9])?$ ]]
          [[ "$GCP_WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          for key in GCP_DEPLOYER_SERVICE_ACCOUNT GCP_RUNTIME_SERVICE_ACCOUNT; do
            [[ "${!key}" =~ ^[a-z][a-z0-9-]*@[a-z][a-z0-9-]*\.iam\.gserviceaccount\.com$ ]]
            [[ "${!key}" == *"@$GCP_PROJECT_ID.iam.gserviceaccount.com" ]]
          done
          [[ "$GCP_DEPLOYER_SERVICE_ACCOUNT" != "$GCP_RUNTIME_SERVICE_ACCOUNT" ]]
          [[ "$HARBORLIGHT_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HARBORLIGHT_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$HARBORLIGHT_SOURCE_IMAGE" == "europe-central2-docker.pkg.dev/harborlight-dev/harborlight/api@$HARBORLIGHT_IMAGE_DIGEST" ]]
          [[ "$HARBORLIGHT_FRONTEND_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$HARBORLIGHT_FRONTEND_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$HARBORLIGHT_FRONTEND_ARTIFACT_NAME" =~ ^harborlight-dev-frontend-[1-9][0-9]*-[1-9][0-9]*$ ]]
          printf 'HARBORLIGHT_IMAGE_TAG=%s-docker.pkg.dev/%s/%s/api:%s\n' \
            "$GCP_REGION" "$GCP_PROJECT_ID" "$GCP_ARTIFACT_REPOSITORY" "$HARBORLIGHT_SOURCE_SHA" >> "$GITHUB_ENV"
          printf 'HARBORLIGHT_IMAGE=%s-docker.pkg.dev/%s/%s/api@%s\n' \
            "$GCP_REGION" "$GCP_PROJECT_ID" "$GCP_ARTIFACT_REPOSITORY" "$HARBORLIGHT_IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download the frontend archive tested on DEV
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.gate.outputs.dev_run_id }}
          name: ${{ needs.gate.outputs.frontend_artifact_name }}
          path: ${{ runner.temp }}/harborlight-dev-frontend

      - name: Verify and extract the exact tested frontend archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_frontend.py \
            --verify-archive "$RUNNER_TEMP/harborlight-dev-frontend/harborlight-frontend.tar.gz" \
            --commit "$HARBORLIGHT_SOURCE_SHA" \
            --expected-sha256 "$HARBORLIGHT_FRONTEND_ARCHIVE_SHA256" \
            --extract-to build/frontend > "$RUNNER_TEMP/harborlight-frontend-verified.json"
          node --input-type=module - "$RUNNER_TEMP/harborlight-frontend-verified.json" <<'JS'
          import { readFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          if (metadata.commit !== process.env.HARBORLIGHT_SOURCE_SHA ||
              metadata.archive_sha256 !== process.env.HARBORLIGHT_FRONTEND_ARCHIVE_SHA256 ||
              metadata.manifest_sha256 !== process.env.HARBORLIGHT_FRONTEND_MANIFEST_SHA256) {
            throw new Error('Frontend archive does not match the successful DEV release');
          }
          JS

      - name: Install pinned Firebase deployment tool
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/harborlight-firebase-cli" \
            --no-audit --no-fund firebase-tools@15.34.2
          printf '%s\n' "$RUNNER_TEMP/harborlight-firebase-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install hosted browser acceptance dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.62.0
          python3 -m playwright install --with-deps chromium
          python3 - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              executable = Path(playwright.chromium.executable_path)
              if not executable.is_file():
                  raise RuntimeError('Installed Chromium executable was not found')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                  output.write(f'HARBORLIGHT_CHROMIUM={executable}\n')
          PY

      - name: Setup Go for pinned image-copy tool
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Install pinned manifest-preserving image-copy tool
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6

      # Only this dependent job can request Google credentials, after all gates.
      - name: Authenticate with short-lived Google credentials
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify isolated production project
        shell: bash
        run: |
          set -euo pipefail
          project_environment="$(gcloud projects describe "$GCP_PROJECT_ID" --format='value(labels.harborlight_env)')"
          [[ "$project_environment" == prod ]] || { printf '::error::Expected harborlight_env=prod.\n'; exit 1; }

      - name: Require the production domain and HTTPS to be ready
        run: python3 infra/google-cloud/prepare-domain.py --status-only

      - name: Copy the exact tested DEV image and verify its digest
        shell: bash
        run: |
          set -euo pipefail
          for registry in "$GCP_REGION-docker.pkg.dev" europe-central2-docker.pkg.dev; do
            gcloud auth print-access-token --project="$GCP_PROJECT_ID" | \
              crane auth login "$registry" --username oauth2accesstoken --password-stdin
          done
          crane copy "$HARBORLIGHT_SOURCE_IMAGE" "$HARBORLIGHT_IMAGE_TAG"
          destination_digest="$(crane digest "$HARBORLIGHT_IMAGE_TAG")"
          if [[ "$destination_digest" != "$HARBORLIGHT_IMAGE_DIGEST" ]]; then
            printf '::error::Copied image differs from the image verified on DEV.\n'
            exit 1
          fi

      - name: Generate isolated runtime settings
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/google-cloud/runtime-config.py --project "$GCP_PROJECT_ID" \
            --release "$HARBORLIGHT_SOURCE_SHA" --account-api-enabled "$HARBORLIGHT_ACCOUNT_API_ENABLED" \
            --output "$RUNNER_TEMP/harborlight-runtime.json"

      - name: Deploy the promoted image without rebuilding
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" \
            --image="$HARBORLIGHT_IMAGE" --service-account="$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --execution-environment=gen2 --port=8080 --cpu=1 --memory=512Mi \
            --cpu-throttling --no-cpu-boost --min-instances=0 --max-instances=2 \
            --concurrency=20 --timeout=30 --ingress=all --allow-unauthenticated \
            --env-vars-file="$RUNNER_TEMP/harborlight-runtime.json" --quiet
          api_url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" --region="$GCP_REGION" --format='value(status.url)')"
          [[ "$api_url" =~ ^https://[a-z0-9.-]+\.run\.app$ ]]
          printf 'url=%s\n' "$api_url" >> "$GITHUB_OUTPUT"

      - name: Verify the promoted production release
        shell: bash
        env:
          HARBORLIGHT_API_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for endpoint in health ready; do
            response="$(curl --fail --silent --show-error --retry 8 --retry-all-errors \
              --retry-connrefused --retry-delay 3 --connect-timeout 10 --max-time 20 \
              "$HARBORLIGHT_API_URL/$endpoint")"
            HEALTH_RESPONSE="$response" node --input-type=module -e '
              const body = JSON.parse(process.env.HEALTH_RESPONSE);
              if (body?.status !== "ok" || body.service !== "harborlight-api" ||
                  body.environment !== "production" || body.release !== process.env.HARBORLIGHT_SOURCE_SHA) {
                throw new Error("PROD did not confirm the release tested on DEV");
              }
            '
          done
          {
            printf '### HARBORLIGHT — promocja DEV → PROD\n\n'
            printf 'Commit wydania: `%s`\n\n' "$HARBORLIGHT_SOURCE_SHA"
            printf 'Sprawdzony obraz: `%s`\n\n' "$HARBORLIGHT_IMAGE"
            printf 'DEV: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$HARBORLIGHT_DEV_RUN_ID"
            printf 'Adres API: %s\n\n' "$HARBORLIGHT_API_URL"
            printf 'Ten sam digest co na DEV; bez ponownej budowy. Obie sondy produkcyjne PASS.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate environment-specific Hosting routing
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/google-cloud/hosting-config.py --project "$GCP_PROJECT_ID" \
            --service "$GCP_CLOUD_RUN_SERVICE" --region "$GCP_REGION" \
            --output "$RUNNER_TEMP/harborlight-hosting.json"

      - name: Publish the verified frontend without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          firebase deploy --only hosting --project "$GCP_PROJECT_ID" \
            --non-interactive --config "$RUNNER_TEMP/harborlight-hosting.json"

      - name: Verify the promoted hosted frontend manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-connrefused --retry-delay 3 --connect-timeout 10 --max-time 20 \
            --header 'Cache-Control: no-cache' \
            "$HARBORLIGHT_FRONTEND_URL/release.json?commit=$HARBORLIGHT_SOURCE_SHA" \
            --output "$RUNNER_TEMP/harborlight-hosted-release.json"
          node --input-type=module - "$RUNNER_TEMP/harborlight-hosted-release.json" <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const bytes = readFileSync(process.argv[2]);
          const manifest = JSON.parse(bytes.toString('utf8'));
          if (manifest.schema_version !== 1 || manifest.commit !== process.env.HARBORLIGHT_SOURCE_SHA ||
              createHash('sha256').update(bytes).digest('hex') !== process.env.HARBORLIGHT_FRONTEND_MANIFEST_SHA256) {
            throw new Error('PROD did not serve the exact frontend tested on DEV');
          }
          JS

      - name: Test the promoted hosted game in Chromium
        id: hosted_browser
        env:
          HARBORLIGHT_BASE_URL: https://harborlight.pl
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python3 -u tests/harborlight-hosted-v18-smoke.py 2>&1 | tee "$RUNNER_TEMP/harborlight-hosted-browser.log"
          browser_status=${PIPESTATUS[0]}
          set -e
          if (( browser_status != 0 )); then
            node --input-type=module - "$RUNNER_TEMP/harborlight-hosted-browser.log" <<'JS' || true
          import { readFileSync } from 'node:fs';
          const text = readFileSync(process.argv[2], 'utf8') || 'Hosted browser acceptance failed without output.';
          let escaped = '';
          for (const character of Array.from(text.slice(-6000)).reverse()) {
            const piece = character === '%' ? '%25' : character === '\r' ? '%0D' : character === '\n' ? '%0A' : character;
            if (escaped.length + piece.length > 6000) break;
            escaped = piece + escaped;
          }
          console.log(`::error title=Hosted browser acceptance failed::${escaped}`);
          JS
          fi
          exit "$browser_status"

      - name: Publish hosted browser failure diagnostics
        if: ${{ failure() && steps.hosted_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-hosted-browserfailure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/harborlight-hosted-browser.log
            /tmp/harborlight-v18-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Summarize the complete production game release
        shell: bash
        run: |
          {
            printf '\n### Gra na PROD\n\n'
            printf 'Graj: %s\n\n' "$HARBORLIGHT_FRONTEND_URL"
            printf 'Archiwum frontendu SHA-256: `%s`\n\n' "$HARBORLIGHT_FRONTEND_ARCHIVE_SHA256"
            printf 'Frontend i backend są identycznymi pakietami sprawdzonymi na PRE-PROD. Sumy hostowanych plików, wejście anonimowe i rzeczywiste odczytowe renderowanie istniejącej zalogowanej wyspy PROD PASS; zapisy testowe były blokowane.\n'
          } >> "$GITHUB_STEP_SUMMARY"
