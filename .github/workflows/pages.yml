name: Deploy HARBORLIGHT to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build island image asset
        run: |
          python3 - <<'PY'
          import base64, re
          src = open('harborlight-island-v02-small.b64', 'r', encoding='utf-8').read()
          cleaned = re.sub(r'[^A-Za-z0-9+/=]', '', src)
          cleaned += '=' * ((4 - len(cleaned) % 4) % 4)
          data = base64.b64decode(cleaned, validate=False)
          if not data.startswith(b'\xff\xd8'):
              raise SystemExit('decoded asset is not a JPEG')
          open('harborlight-island-v02.jpg', 'wb').write(data)
          print('JPEG bytes:', len(data))
          PY
          test -s harborlight-island-v02.jpg
          file harborlight-island-v02.jpg

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
